<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        :root {
            --bg: #ffffff;
            --text: #ffffff !important;
            --search-bg: rgba(40,40,40,0.45);
            --search-hover: rgba(60,60,60,0.6);
            --link-color: #ffffff !important;
        }

        .dark {
            --bg: #121212;
            --text: #ffffff !important;
            --search-bg: rgba(30,30,30,0.5);
            --search-hover: rgba(50,50,50,0.7);
            --link-color: #ffffff !important;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12vh;
            position: relative;
            overflow-x: hidden;
        }
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .bg-mask {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(0,0,0,0.42);
        }
        .dark .bg-mask {
            background: rgba(0,0,0,0.58);
        }

        .weather-box {
            position: fixed;
            top: 24px;
            left: 24px;
            padding: 14px 18px;
            border-radius: 14px;
            background: var(--search-bg);
            min-width: 180px;
            z-index: 10;
            transform: scale(0.8);
            transform-origin: top left;
        }
        .weather-location {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 4px;
            color: var(--text);
        }
        .weather-main {
            display: flex;
            align-items: baseline;
            gap:8px;
        }
        .weather-temp {
            font-size: 26px;
            font-weight: 500;
            color: var(--text);
        }
        .weather-desc {
            font-size:15px;
            color: var(--text);
        }
        .weather-other {
            margin-top: 6px;
            font-size:13px;
            opacity:0.8;
            color: var(--text);
        }

        .community-status {
            position: fixed;
            top:24px;
            right:24px;
            margin-bottom:54px;
            font-size:13px;
            font-weight:bold;
            z-index:11;
            transform: scale(0.75);
            transform-origin: top right;
        }
        .status-online {
            color:#22c55e;
        }
        .status-offline {
            color:#ef4444;
        }

        .tips-box {
            position: fixed;
            bottom: 24px;
            left: 24px;
            max-width: 420px;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--search-bg);
            font-size: 14px;
            line-height: 1.6;
            min-height: 46px;
            color: var(--text);
            transform: scale(0.75);
            transform-origin: bottom left;
        }
        .tips-text {
            white-space: pre;
            color: var(--text);
        }
        .cursor {
            display: inline-block;
            width: 7px;
            height: 16px;
            background: #fff;
            margin-left: 3px;
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            0%,49% {opacity:1;}
            50%,100% {opacity:0;}
        }

        .ping-panel {
            position: fixed;
            bottom:24px;
            right:24px;
            padding:12px 16px;
            border-radius:12px;
            background: var(--search-bg);
            font-size:13px;
            line-height:1.7;
            color: var(--text);
            transform: scale(0.8);
            transform-origin: bottom right;
        }
        .ping-item {
            display:flex;
            justify-content:space-between;
            gap:16px;
        }
        .ping-ok {color:#22c55e;}
        .ping-fail {color:#ef4444;}
        .ping-wait {opacity:0.6; color:#fff;}

        .bg-setting-btn {
            position: fixed;
            bottom: 160px;
            right:24px;
            width:40px;
            height:40px;
            border-radius:50%;
            background: var(--search-bg);
            border:none;
            font-size:18px;
            cursor:pointer;
            z-index:12;
            color:#fff;
            transform: scale(0.75);
            transform-origin: bottom right;
        }
        .bg-panel {
            position: fixed;
            bottom:210px;
            right:24px;
            width:360px;
            padding:16px;
            border-radius:14px;
            background: var(--search-bg);
            z-index:13;
            display:none;
            color:#fff;
            transform: scale(0.75);
            transform-origin: bottom right;
        }
        .bg-panel.show {
            display:block;
        }
        .bg-panel h4 {
            margin-bottom:10px;
        }
        .bg-panel input[type="text"] {
            width:100%;
            padding:8px;
            border-radius:6px;
            border:1px solid #777;
            margin-bottom:10px;
            background:rgba(255,255,255,0.15);
            color:#fff;
        }
        .preset-wallpaper {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap:6px;
            margin:10px 0;
        }
        .preset-wallpaper button {
            height:40px;
            border:none;
            border-radius:4px;
            cursor:pointer;
            background-size:cover;
            background-position:center;
        }
        .bg-buttons {
            display:flex;
            gap:8px;
            flex-wrap:wrap;
            margin-top:8px;
        }
        .bg-buttons button,
        .label-upload {
            padding:6px 10px;
            border-radius:6px;
            border:none;
            cursor:pointer;
            background:rgba(255,255,255,0.2);
            color:#fff;
        }
        input#file-upload {
            display:none;
        }

        .theme-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            border: none;
            background: var(--search-bg);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transform: scale(0.8);
            transform-origin: top right;
        }

        .center-wrap{
            transform: scale(0.75);
            transform-origin: center top;
            width: 100%;
            display:flex;
            flex-direction:column;
            align-items:center;
        }

        .time-box {
            font-size: 5rem;
            font-weight: 300;
            margin-bottom: 8px;
            color: var(--text);
        }
        .date-box {
            font-size: 1.3rem;
            opacity: 0.85;
            margin-bottom: 48px;
            color: var(--text);
        }

        .search-wrap {
            width: min(620px, 90vw);
        }
        #search-input {
            width: 100%;
            padding: 16px 22px;
            border-radius: 999px;
            border: none;
            outline: none;
            font-size: 18px;
            background: var(--search-bg);
            color: #fff;
        }
        #search-input::placeholder {
            color:rgba(255,255,255,0.7);
        }
        #search-input:hover, #search-input:focus {
            background: var(--search-hover);
        }

        .nav-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            margin-top: 48px;
            max-width: 650px;
        }
        .nav-item a {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--link-color);
            text-decoration: none;
            gap: 8px;
        }
        .nav-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--search-bg);
            display: grid;
            place-items: center;
        }
        .nav-icon img {
            width:28px;
            height:28px;
            object-fit:contain;
        }
    </style>
</head>
<body>
    <div class="bg-layer" id="bgLayer"></div>
    <div class="bg-mask"></div>

    <div class="weather-box" id="weatherBox">
        <div class="weather-location" id="weatherLoc">加载中...</div>
        <div class="weather-main">
            <span class="weather-temp" id="weatherTemp">--°C</span>
            <span class="weather-desc" id="weatherDesc">---</span>
        </div>
        <div class="weather-other" id="weatherExtra"></div>
    </div>

    <div class="community-status" id="communityStatus"></div>

    <div class="tips-box">
        <span class="tips-text" id="tipsText"></span>
        <span class="cursor" id="cursor"></span>
    </div>

    <div class="ping-panel" id="pingPanel">
        <div class="ping-item"><span>discord.com</span><span id="ping-discord">检测中</span></div>
        <div class="ping-item"><span>github.com</span><span id="ping-github">检测中</span></div>
        <div class="ping-item"><span>florr.io</span><span id="ping-florr">检测中</span></div>
        <div class="ping-item"><span>cn.bing.com</span><span id="ping-bing">检测中</span></div>
    </div>

    <button class="bg-setting-btn" id="bgSetBtn">🖼</button>
    <div class="bg-panel" id="bgPanel">
        <h4>自定义背景</h4>
        <div>
            <p style="font-size:13px;margin-bottom:6px;">预设壁纸（点击切换）</p>
            <div class="preset-wallpaper" id="presetWallpaperBox"></div>
        </div>
        <hr style="margin:12px 0;border-color:rgba(255,255,255,0.2)">
        <input type="text" id="bgUrlInput" placeholder="粘贴图片网络链接">
        <label class="label-upload">
            上传本地图片
            <input type="file" id="file-upload" accept="image/*">
        </label>
        <div class="bg-buttons">
            <button id="applyUrlBtn">应用链接</button>
            <button id="resetBgBtn">重置背景</button>
        </div>
    </div>

    <button class="theme-btn" id="themeBtn">🌓</button>

    <div class="center-wrap">
        <div class="time-box" id="timeText"></div>
        <div class="date-box" id="dateText"></div>

        <div class="search-wrap">
            <input id="search-input" placeholder="输入内容搜索，回车使用 Bing 搜索" autocomplete="off">
        </div>

        <div class="nav-list">
            <div class="nav-item">
                <a href="https://github.com/">
                    <div class="nav-icon">
                        <img src="https://github.githubassets.com/favicons/favicon.svg" alt="github">
                    </div>
                    <span>GitHub</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="https://mail.163.com/">
                    <div class="nav-icon">
                        <img src="https://mail.163.com/favicon.ico" alt="网易邮箱">
                    </div>
                    <span>网易邮箱</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="https://www.cnuhs.cn/">
                    <div class="nav-icon">
                        <img src="https://www.cnuhs.cn/favicon.ico" alt="cnuhs">
                    </div>
                    <span>CNUHS</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="https://discord.com/">
                    <div class="nav-icon">
                        <img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY0JNqdv_4nV9_p0FUrrwsVYaFH1YT6AACzyYAAvmbuFevU0J4Fk132j0E.png" alt="discord">
                    </div>
                    <span>Discord</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="https://www.cloudflare.com/">
                    <div class="nav-icon">
                        <img src="https://www.cloudflare.com/favicon.ico" alt="cloudflare">
                    </div>
                    <span>Cloudflare</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        const presetWallpapers = [
            "https://picui.ogmua.cn/s1/2026/08/08/6a771bb58ebdf.webp",
            "https://picui.ogmua.cn/s1/2026/08/08/6a771bb5e0a51.webp",
            "https://picui.ogmua.cn/s1/2026/08/08/6a771bb649cd7.webp",
            "https://picui.ogmua.cn/s1/2026/08/08/6a771bb64d719.webp",
            "https://picui.ogmua.cn/s1/2026/08/08/6a771bb757886.webp",
            "https://picui.ogmua.cn/s1/2026/08/08/6a771c2332a2e.webp",
            "https://picui.ogmua.cn/s1/2026/08/08/6a771c2d6d4d8.webp",
            "https://picui.ogmua.cn/s1/2026/08/08/6a771c2e27f94.webp",
            "https://picui.ogmua.cn/s1/2026/08/08/6a771c2e212d4.webp",
            "https://picui.ogmua.cn/s1/2026/08/08/6a771c38218e3.webp"
        ];

        const presetBox = document.getElementById("presetWallpaperBox");
        presetWallpapers.forEach(url => {
            const btn = document.createElement("button");
            btn.style.backgroundImage = `url(${url})`;
            btn.title = "点击应用这张壁纸";
            btn.onclick = () => {
                bgLayer.style.backgroundImage = `url(${url})`;
                localStorage.setItem("customBg", url);
            }
            presetBox.appendChild(btn);
        });

        const bgLayer = document.getElementById("bgLayer");
        const bgSetBtn = document.getElementById("bgSetBtn");
        const bgPanel = document.getElementById("bgPanel");
        const bgUrlInput = document.getElementById("bgUrlInput");
        const applyUrlBtn = document.getElementById("applyUrlBtn");
        const fileUpload = document.getElementById("file-upload");
        const resetBgBtn = document.getElementById("resetBgBtn");

        function loadSavedBackground(){
            const savedBg = localStorage.getItem("customBg");
            if(savedBg){
                bgLayer.style.backgroundImage = `url(${savedBg})`;
            } else {
                bgLayer.style.backgroundImage = `url(${presetWallpapers[0]})`;
            }
        }
        loadSavedBackground();

        bgSetBtn.onclick = ()=>{
            bgPanel.classList.toggle("show");
        }

        applyUrlBtn.onclick = ()=>{
            const url = bgUrlInput.value.trim();
            if(!url) return;
            bgLayer.style.backgroundImage = `url(${url})`;
            localStorage.setItem("customBg", url);
        }

        fileUpload.onchange = (e)=>{
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(ev){
                const dataUrl = ev.target.result;
                bgLayer.style.backgroundImage = `url(${dataUrl})`;
                localStorage.setItem("customBg", dataUrl);
            }
            reader.readAsDataURL(file);
        }

        resetBgBtn.onclick = ()=>{
            bgLayer.style.backgroundImage = "";
            localStorage.removeItem("customBg");
            bgUrlInput.value = "";
        }

        function updateTime(){
            const now = new Date();
            const h = String(now.getHours()).padStart(2,'0');
            const m = String(now.getMinutes()).padStart(2,'0');
            document.getElementById('timeText').innerText = `${h}:${m}`;
            const weekArr = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
            document.getElementById('dateText').innerText = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekArr[now.getDay()]}`;
        }
        updateTime();
        setInterval(updateTime,1000);

        const input = document.getElementById('search-input');
        input.addEventListener('keydown',e=>{
            if(e.key === 'Enter' && input.value.trim()){
                window.open(`https://cn.bing.com/search?q=${encodeURIComponent(input.value.trim())}`);
            }
        })

        const themeBtn = document.getElementById('themeBtn');
        themeBtn.onclick = ()=>{
            document.body.classList.toggle('dark');
            localStorage.setItem('darkMode', document.body.classList.contains('dark'))
        }
        if(localStorage.getItem('darkMode') === "true"){
            document.body.classList.add('dark');
        }

        const weatherLoc = document.getElementById('weatherLoc');
        const weatherTemp = document.getElementById('weatherTemp');
        const weatherDesc = document.getElementById('weatherDesc');
        const weatherExtra = document.getElementById('weatherExtra');
        const tipsText = document.getElementById('tipsText');
        const communityStatus = document.getElementById('communityStatus');

        const CACHE_KEY = "weather_data";
        const CACHE_EXPIRE = 20 * 60 * 1000;
        let adviceList = [];
        let currentIndex = 0;
        let typingLock = false;

        function sleep(ms){
            return new Promise(res=>setTimeout(res,ms));
        }

        async function typeWriter(text) {
            if(typingLock) return;
            typingLock = true;
            tipsText.textContent = "";
            const speed = 40;
            for(let i=0; i<text.length; i++){
                tipsText.textContent += text[i];
                await sleep(speed);
            }
            typingLock = false;
        }

        function startLoop() {
            if(adviceList.length === 0) return;
            const showAdvice = adviceList[currentIndex];
            typeWriter(showAdvice);
            currentIndex = (currentIndex + 1) % adviceList.length;
            setTimeout(startLoop, 5000);
        }

        async function loadWeather(){
            const cacheStr = localStorage.getItem(CACHE_KEY);
            let data;
            if(cacheStr){
                const cache = JSON.parse(cacheStr);
                const now = Date.now();
                if(now - cache.time < CACHE_EXPIRE){
                    data = cache.data;
                    renderAll(data);
                    return;
                }
            }
            try {
                const res = await fetch("https://uapis.cn/api/v1/misc/weather?extended=true&indices=true");
                if(!res.ok) throw new Error("请求异常");
                data = await res.json();
                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    time: Date.now(),
                    data
                }));
                renderAll(data);
            } catch(err){
                console.error("天气接口错误",err);
                weatherLoc.innerText = "天气加载失败";
                weatherTemp.innerText = "--°C";
                weatherDesc.innerText = "";
                weatherExtra.innerText = "建议使用Live Server打开";
                tipsText.innerText = "无法获取生活建议";
            }
        }

        function renderAll(d){
            weatherLoc.innerText = d.district || d.city || d.province;
            weatherTemp.innerText = `${d.temperature}°C`;
            weatherDesc.innerText = d.weather;
            weatherExtra.innerText = `${d.wind_direction}${d.wind_power} | 湿度${d.humidity}%`;

            const indices = d.life_indices;
            adviceList = [];
            for(const key in indices){
                adviceList.push(indices[key].advice);
            }
            startLoop();
        }

        loadWeather();

        const targets = [
            {name:"discord", host:"https://discord.com"},
            {name:"github", host:"https://github.com"},
            {name:"florr", host:"https://florr.io"},
            {name:"bing", host:"https://cn.bing.com"}
        ];

        async function testSite(name, url, timeout=4500){
            const ctrl = new AbortController();
            const timer = setTimeout(()=>ctrl.abort(), timeout);
            try {
                await fetch(url, {
                    method:"HEAD",
                    signal:ctrl.signal,
                    mode:"no-cors"
                });
                clearTimeout(timer);
                return true;
            }catch(e){
                clearTimeout(timer);
                return false;
            }
        }

        async function runPingCheck(){
            for(const t of targets){
                const ok = await testSite(t.name, t.host);
                const el = document.getElementById(`ping-${t.name}`);
                if(ok){
                    el.textContent = "正常";
                    el.className = "ping-ok";
                }else{
                    el.textContent = "超时";
                    el.className = "ping-fail";
                }
                if(t.name === "discord"){
                    if(ok){
                        communityStatus.textContent = "已连接community";
                        communityStatus.className = "community-status status-online";
                    }else{
                        communityStatus.textContent = "未连接community";
                        communityStatus.className = "community-status status-offline";
                    }
                }
            }
        }

        runPingCheck();
        setInterval(runPingCheck, 60000);
    </script>
</body>
</html>
